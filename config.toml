baseURL = "https://ai.limzero.com/"
locale = "zh-CN"
title = "凌零集 | Limzero AI Hub"
enableGitInfo = false

# 本站 tags 仅作数据字段，不使用 Hugo 原生 taxonomy 页面
disableKinds = ["taxonomy"]

[params]
  siteName = "凌零集"
  siteEn = "Limzero AI Hub"
  slogan = "免费大模型API · Token额度 · AI算力与托管资源导航"
  disclaimerShort = "本站仅为第三方信息导航聚合，不提供算力、不中转API、不售卖token、不担保服务可用性。"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML"]
