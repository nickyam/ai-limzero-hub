baseURL = "https://ai.limzero.com/"
locale = "zh-CN"
title = "凌零集 | Limzero AI Hub"
enableGitInfo = false

# 本站 tags 仅作数据字段，不使用 Hugo 原生 taxonomy 页面
disableKinds = ["taxonomy"]

[params]
  siteName = "凌零集"
  siteEn = "Limzero AI Hub"
  slogan = "免费大模型API · Token额度 · AI算力与托管资源导航"

# Google AdSense（Auto Ads 自动投放）
# 站点需在 AdSense 后台添加 ai.limzero.com 并通过审核、开启 Auto Ads 后广告才展示
[params.adsense]
  enabled = true
  client = "ca-pub-7114121088728794"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML"]
