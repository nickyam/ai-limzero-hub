<footer class="site-footer">
  <div class="container">
    <nav class="footer-nav" aria-label="分类导航">
      {{ $seen := slice }}
      {{ range site.Data.resources }}
        {{ if not (in $seen .type) }}
          {{ $seen = $seen | append .type }}
          <a href="/categories/{{ partial "cat-slug.html" .type }}/">{{ .type }}</a>
        {{ end }}
      {{ end }}
      <span class="sep">·</span>
      <a href="/about/">关于</a>
      <a href="/disclaimer/">免责声明</a>
      <a href="/privacy/">隐私政策</a>
    </nav>
    <p>Copyright © {{ now.Year }} <a href="/">凌零集</a> · 保留所有权利</p>
  </div>
</footer>
