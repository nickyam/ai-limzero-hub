{{ define "main" }}
<section class="hero small">
  <h1 class="site-title">{{ .Title }}</h1>
  <p class="slogan">{{ site.Params.slogan }}</p>
</section>

<section class="resource-list">
  {{ partial "resource-list.html" (dict "items" (where site.Data.resources "type" .Params.category)) }}
</section>
{{ end }}
