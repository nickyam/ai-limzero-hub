# 凌零集 ai.limzero.com —— OpenResty / Nginx 参考配置
# 站点目录沿用你的 ECS 约定：/opt/1panel/apps/openresty/openresty/www/sites/ai.limzero.com/index
# 注意：阿里云 80 端口被合规拦截，只走 HTTPS（证书用 DNS-01 签发）。

server {
    listen 80;
    server_name ai.limzero.com;
    # 80 仅做跳转；若被云厂商拦截，请直接用 https 访问
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai.limzero.com;

    root /opt/1panel/apps/openresty/openresty/www/sites/ai.limzero.com/index;
    index index.html;

    ssl_certificate     /path/to/ai.limzero.com/fullchain.pem;
    ssl_certificate_key /path/to/ai.limzero.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Hugo 静态页：优先文件，再目录索引，最后 404
    try_files $uri $uri/ =404;

    # Pagefind 索引为静态资源
    location /pagefind/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 构建产物缓存（带内容指纹，可长缓存）
    location ~* \.(css|js|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
