# 凌零集 ai.limzero.com —— OpenResty / Nginx vhost 配置
#
# 【用法】
#   1Panel 已自动生成基础 vhost：
#     /opt/1panel/apps/openresty/openresty/conf/conf.d/ai.limzero.com.conf
#   本文件是「增强版」：在其基础上补了
#     ① 443 HTTPS server 块（证书签好后生效）
#     ② 带内容指纹的静态资源长缓存（css/js 文件名含 sha256 哈希）
#     ③ 中文 slug 分类页 / 资源页的 try_files 兜底
#
# 【路径陷阱（重要）】
#   这份文件由【容器内】的 OpenResty 读取，root 必须写容器内路径：
#     容器内：/www/sites/ai.limzero.com/index
#     宿主机：/opt/1panel/apps/openresty/openresty/www/sites/ai.limzero.com/index
#   （宿主机 .../www 挂载为容器内 /www；子目录名是 index，1Panel 静态站点约定）
#   写成宿主机路径会导致全站 404。
#
# 【重要】
#   阿里云备案 ECS 的 80 端口明文被透明劫持（响应被替换成 403 灰页），
#   所以 HTTP-01 签证书走不通 —— 必须 HTTPS + DNS-01 签发。
#   证书放在：/www/sites/ai.limzero.com/ssl/{fullchain.pem,privkey.pem}

server {
    listen 80;
    server_name ai.limzero.com;

    # ACME 校验目录（DNS-01 不需要，保留以备 HTTP-01 调试）
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai.limzero.com;

    root /www/sites/ai.limzero.com/index;
    index index.html;

    ssl_certificate     /www/sites/ai.limzero.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/ai.limzero.com/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000";

    access_log /www/sites/ai.limzero.com/log/access.log main;
    error_log  /www/sites/ai.limzero.com/log/error.log;

    # Hugo 静态页：文件 → 目录内的 index.html → 目录 → 404
    # 分类页 slug 是中文（如 /categories/大模型api/），资源页是 /resources/<slug>/，
    # 两者都以 / 结尾，必须能落到各自的 index.html。
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # 带内容指纹的构建产物（css/js 目录下的文件名含 sha256 哈希）
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 图片、字体等静态资源（文件名无指纹，用短期缓存 + must-revalidate）
    location ~* \.(svg|png|jpg|jpeg|gif|webp|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
}
